<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapFull</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 8h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="6.5" cy="5.5" r="1" fill="currentColor"/>
        <circle cx="9.5" cy="5.5" r="1" fill="currentColor"/>
        <path d="M8 13l2.5 2.5L16 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="title">SnapFull</span>
    </div>

    <!-- Capture Button -->
    <button class="btn-capture" id="btnCapture">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-4l-2-2H9L7 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      Capture Full Page
    </button>

    <!-- Status area -->
    <div class="status" id="status" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="status-text" id="statusText">Preparing…</span>
    </div>

    <!-- History button -->
    <button class="btn-history" id="btnHistory">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      History
      <span class="history-badge" id="historyBadge" hidden>0</span>
    </button>

    <!-- Pro / License section -->
    <div class="divider" hidden></div>

    <div class="pro-section" id="proSection" hidden>

      <!-- State A: free -->
      <div id="psDefault" class="ps">
        <div class="ps-info-row">
          <svg class="ps-lock-icon" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="ps-features-hint">Crop · Annotate · Batch capture</span>
        </div>
        <div class="ps-btns">
          <button class="btn-get-pro" id="btnGetPro">⬆ Get Pro</button>
          <button class="btn-enter-key" id="btnEnterKey">Enter Key</button>
        </div>
      </div>

      <!-- State B: key input -->
      <div id="psInput" class="ps" hidden>
        <label class="ps-label" for="licenseInput">License Key</label>
        <input id="licenseInput" class="license-input" type="text"
               placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"
               autocomplete="off" spellcheck="false" />
        <div id="psError" class="ps-error" hidden></div>
        <div class="ps-btns">
          <button class="btn-key-cancel" id="btnKeyCancel">Cancel</button>
          <button class="btn-key-confirm" id="btnKeyConfirm">Activate →</button>
        </div>
      </div>

      <!-- State C: activating -->
      <div id="psActivating" class="ps" hidden>
        <div class="ps-activating-row">
          <div class="ps-spinner"></div>
          <span>Activating…</span>
        </div>
      </div>

      <!-- State D: pro active -->
      <div id="psActive" class="ps" hidden>
        <div class="ps-active-row">
          <div class="ps-pro-badge">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Pro
          </div>
          <div class="ps-email" id="proEmail"></div>
        </div>
        <div class="ps-remove-row" id="psRemoveRow">
          <button class="btn-remove-key" id="btnRemoveKey">Remove License</button>
        </div>
        <div class="ps-remove-confirm-row" id="psRemoveConfirmRow" hidden>
          <span class="ps-remove-confirm-text">Remove this device?</span>
          <button class="btn-key-cancel" id="btnRemoveCancel">Cancel</button>
          <button class="btn-remove-key-confirm" id="btnRemoveConfirm">Remove</button>
        </div>
      </div>

    </div>

    <!-- Shortcut hint -->
    <div class="hint" id="shortcutHint">
      <span>Shortcut:</span>
      <kbd id="kbdMod">Alt</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>P</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
